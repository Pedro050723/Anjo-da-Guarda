{% extends 'gestao/base.html' %} 
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

        <div class="card shadow-lg border-0 rounded-lg">

            <div class="card-header bg-primary text-white py-3">
                <h3 class="mb-0"><i class="fas fa-handshake me-2"></i>Contratar Cuidador</h3>
            </div>

            <div class="card-body p-4">

                <div class="alert alert-light border shadow-sm mb-4">
                    <i class="fas fa-info-circle text-primary me-2"></i> Envie um convite usando o <strong>nome de usuário</strong> do cuidador. Ele precisará aceitar o convite no painel dele.
                </div>

                <form method="post">
                    {% csrf_token %} 
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary" for="select-idoso">
                            <i class="fas fa-user-injured me-1"></i> Para qual idoso?
                        </label>
                        <select name="idoso" id="select-idoso" class="form-select" required>
                            <option value="" disabled selected>Selecione um idoso da lista...</option>
                            {% for idoso in meus_idosos %}
                                <option value="{{ idoso.id }}">{{ idoso.nome }}</option>
                            {% empty %}
                                <option value="" disabled>Nenhum idoso cadastrado. Cadastre um primeiro.</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary" for="input-cuidador">
                            <i class="fas fa-user-nurse me-1"></i> Nome de usuário do Cuidador
                        </label>
                        <input type="text" name="username_cuidador" id="input-cuidador" class="form-control" required placeholder="Digite o login exato do cuidador">
                    </div>

                    <hr class="my-4">

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary me-md-2">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">
                            <i class="fas fa-paper-plane me-2"></i> Enviar Convite
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<style>
    /* Mantive o CSS para garantir o visual, adicionando classes do bootstrap */
    input[type="text"],
    select {
        display: block;
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        color: #212529;
        background-color: #fff;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    
    input:focus,
    select:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
</style>

{% endblock %}
