{% extends 'gestao/base.html' %} 
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

        <div class="card shadow-lg border-0 rounded-lg">

            <div class="card-header bg-primary text-white py-3">
                <h3 class="mb-0"><i class="fas fa-user-plus me-2"></i>Cadastrar Novo Idoso</h3>
            </div>

            <div class="card-body p-4">
                <p class="text-muted mb-4">
                    Preencha os dados de quem receberá os cuidados. Essas informações ajudarão os cuidadores.
                </p>

                <form method="post">
                    {% csrf_token %} 
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary" for="id_nome">
                            <i class="fas fa-user me-1"></i> Nome Completo
                        </label>
                        <input type="text" name="nome" id="id_nome" class="form-control" required placeholder="Ex: Maria da Silva">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary" for="id_idade">
                            <i class="fas fa-birthday-cake me-1"></i> Idade
                        </label>
                        <input type="number" name="idade" id="id_idade" class="form-control" required placeholder="Ex: 82">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary" for="id_condicoes">
                            <i class="fas fa-heartbeat me-1 text-danger"></i> Condições de Saúde / Observações
                        </label>
                        <textarea name="condicoes_saude" id="id_condicoes" class="form-control" rows="4" placeholder="Ex: Hipertensão, diabetes, dificuldade de locomoção..."></textarea>
                        <small class="text-muted">Descreva detalhes importantes para o cuidador.</small>
                    </div>

                    <hr class="my-4">

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary me-md-2">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success px-4 fw-bold">
                            <i class="fas fa-save me-2"></i> Salvar Cadastro
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<style>
    /* Mantive seu estilo para garantir compatibilidade, 
       mas adicionei a classe .form-control do bootstrap nos inputs acima */
    input[type="text"],
    input[type="number"],
    textarea,
    select {
        display: block;
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    
    textarea {
        min-height: 100px;
        resize: vertical;
    }
    
    input:focus,
    textarea:focus,
    select:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
</style>

{% endblock %}
