{% extends 'gestao/base.html' %} 
{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white text-center py-4">
                <h3 class="mb-0"><i class="fas fa-user-plus me-2"></i>Criar Conta</h3>
                <small>Junte-se ao Anjo da Guarda</small>
            </div>

            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %} 
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Nome de Usuário</label>
                        <input type="text" name="username" class="form-control" required placeholder="Escolha seu login">
                        <small class="text-muted" style="font-size: 0.8rem;">Será usado para entrar no sistema.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">E-mail</label>
                        <input type="email" name="email" class="form-control" required placeholder="exemplo@email.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Eu sou...</label>
                        <select name="tipo_usuario" class="form-select" required>
                            <option value="" disabled selected>Selecione uma opção</option>
                            <option value="familiar">Familiar (Quero contratar cuidados)</option>
                            <option value="cuidador">Cuidador (Quero oferecer serviços)</option>
                        </select>
                    </div>

                    <hr class="my-4">

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Senha</label>
                        <input type="password" name="senha1" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Confirmar Senha</label>
                        <input type="password" name="senha2" class="form-control" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="fas fa-check-circle"></i> Registrar-se
                        </button>
                    </div>
                </form>
            </div>

            <div class="card-footer text-center py-3 bg-light">
                <div class="small">
                    Já tem uma conta? <a href="{% url 'login' %}" class="text-primary fw-bold">Fazer Login</a>
                </div>
            </div>
        </div>

    </div>
</div>

<style>
    /* Mantivemos seu CSS para garantir o visual, 
       mas adicionei .form-control e .form-select do Bootstrap no HTML acima */
    
    input[type="text"],
    input[type="password"],
    input[type="email"],
    select {
        display: block;
        width: 100%;
        padding: 0.75rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    
    input:focus,
    select:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
</style>

{% endblock %}
