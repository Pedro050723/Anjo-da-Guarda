<h2>Acessar o Sistema</h2>

{% if form.errors %}
<p style="color: red;">Seu nome de usuário ou senha não correspondem. Tente novamente.</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}

    <div style="margin-bottom: 10px;">
        <label>Usuário:</label>
        <br> {{ form.username }}
    </div>

    <div style="margin-bottom: 10px;">
        <label>Senha:</label>
        <br> {{ form.password }}
    </div>

    <button type="submit">Entrar</button>

    <input type="hidden" name="next" value="{{ next }}">
</form>

<p>Não tem conta? <a href="{% url 'cadastrar' %}">Cadastre-se aqui</a></p>
